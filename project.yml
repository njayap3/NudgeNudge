name: NudgeNudge
options:
  bundleIdPrefix: com.neha
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"

targets:
  NudgeNudge:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Assets.xcassets"
      - path: Features
      - path: Models
      - path: Services
      - path: Repositories
      - path: Core
    resources:
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: NudgeNudge
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSUserNotificationsUsageDescription: "NudgeNudge needs notification access to deliver your nudges."
        UILaunchStoryboardName: ""
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.neha.NudgeNudge
      SWIFT_VERSION: "5.9"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - NudgeNudgeTests

  NudgeNudgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NudgeNudgeTests
    dependencies:
      - target: NudgeNudge
